name: Prod Migration Preflight (read-only)

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      result:
        description: "Preflight PASS or FAIL"
        value: ${{ jobs.preflight.outputs.result }}
      completed_at:
        description: "Completion time (KST)"
        value: ${{ jobs.preflight.outputs.completed_at }}
      dms_task_arn:
        description: "Validated Prod DMS task ARN"
        value: ${{ jobs.preflight.outputs.dms_task_arn }}

permissions:
  contents: read
  id-token: write

concurrency:
  group: prod-migration-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate Prod migration readiness (no mutations)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod-migration
    outputs:
      result: ${{ steps.finalize.outputs.result }}
      completed_at: ${{ steps.finalize.outputs.completed_at }}
      dms_task_arn: ${{ steps.finalize.outputs.dms_task_arn }}
    env:
      AWS_REGION: ap-northeast-2
      EXPECTED_ACCOUNT_ID: "919551759796"
      ALB_NAME: needu-prod-alb
      FRONTEND_TARGET_GROUP: needu-prod-fe
      BACKEND_TARGET_GROUP: needu-prod-be
      ECS_CLUSTER: needu-prod-cluster
      ECS_SERVICE_PREFIX: needu-prod
      EXPECTED_TASK_COUNT: "2"
      MYSQL_DB_IDENTIFIER: needu-prod-mysql
      POSTGRES_DB_IDENTIFIER: needu-prod-postgres
      HOSTED_ZONE_ID: Z10258582M6TRCEOCUBUW
      PROD_HOST: prod.needu.gift
      LIVE_HOST: needu.gift
      V1_EIP: 13.124.155.10
      V1_INSTANCE_ID: i-071de18816cfae436
      DMS_TASK_ID: ${{ vars.MIGRATION_DMS_TASK_ID }}
      DNS_PHASE: after
      SSM_BASTION_INSTANCE_ID: i-0fc4a029b4d5b90ca
      MYSQL_LOCAL_PORT: "23306"
      POSTGRES_LOCAL_PORT: "25432"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare evidence directory
        shell: bash
        run: |
          set -euo pipefail
          echo "PREFLIGHT_RESULT_DIR=$RUNNER_TEMP/prod-migration-preflight" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/prod-migration-preflight"

      - name: Configure AWS read-only role
        id: aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.MIGRATION_PREFLIGHT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: prod-migration-preflight-${{ github.run_id }}

      - name: Verify AWS account
        id: account
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          actual="$(aws sts get-caller-identity --query Account --output text)"
          test "$actual" = "$EXPECTED_ACCOUNT_ID"
          echo "Verified AWS account: $actual"

      - name: Verify current DNS and target Alias
        id: dns
        continue-on-error: true
        shell: bash
        run: bash scripts/migration/preflight/check-dns-prod.sh

      - name: Verify Prod ALB routing and gate baseline
        id: alb
        continue-on-error: true
        shell: bash
        run: bash scripts/migration/preflight/check-alb-prod.sh

      - name: Verify ECS readiness and target health
        id: ecs
        continue-on-error: true
        shell: bash
        run: bash scripts/migration/preflight/check-ecs-prod.sh

      - name: Verify RDS metadata
        id: rds
        continue-on-error: true
        shell: bash
        run: bash scripts/migration/preflight/check-rds-prod.sh

      - name: Verify Prod DMS CDC and table statistics
        id: dms
        continue-on-error: true
        shell: bash
        run: bash scripts/migration/preflight/check-dms-prod.sh

      - name: Install database tunnel tools
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "$RUNNER_TEMP/session-manager-plugin.deb"
          sudo dpkg -i "$RUNNER_TEMP/session-manager-plugin.deb"
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-mysql-client postgresql-client netcat-openbsd

      - name: Resolve target database connection metadata
        id: database-metadata
        shell: bash
        run: |
          set -euo pipefail
          mysql_json="$(aws rds describe-db-instances --db-instance-identifier "$MYSQL_DB_IDENTIFIER" --query 'DBInstances[0]')"
          postgres_json="$(aws rds describe-db-instances --db-instance-identifier "$POSTGRES_DB_IDENTIFIER" --query 'DBInstances[0]')"
          mysql_secret="$(aws secretsmanager get-secret-value --secret-id "$(jq -r '.MasterUserSecret.SecretArn' <<<"$mysql_json")" --query SecretString --output text)"
          postgres_secret="$(aws secretsmanager get-secret-value --secret-id "$(jq -r '.MasterUserSecret.SecretArn' <<<"$postgres_json")" --query SecretString --output text)"
          mysql_password="$(jq -r '.password' <<<"$mysql_secret")"
          postgres_password="$(jq -r '.password' <<<"$postgres_secret")"
          echo "::add-mask::$mysql_password"
          echo "::add-mask::$postgres_password"
          {
            echo "MYSQL_HOST=$(jq -r '.Endpoint.Address' <<<"$mysql_json")"
            echo "MYSQL_USERNAME=$(jq -r '.username' <<<"$mysql_secret")"
            echo "MYSQL_PASSWORD=$mysql_password"
            echo "POSTGRES_HOST=$(jq -r '.Endpoint.Address' <<<"$postgres_json")"
            echo "POSTGRES_USERNAME=$(jq -r '.username' <<<"$postgres_secret")"
            echo "POSTGRES_PASSWORD=$postgres_password"
          } >> "$GITHUB_ENV"

      - name: Open target database tunnels
        id: database-tunnel
        shell: bash
        run: bash scripts/migration/preflight/start-db-tunnel.sh

      - name: Verify target database data and structure
        id: data
        continue-on-error: true
        shell: bash
        run: bash scripts/migration/preflight/check-data-prod.sh

      - name: Close database tunnels
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/preflight-tunnel-pids" ]]; then
            xargs kill < "$RUNNER_TEMP/preflight-tunnel-pids" 2>/dev/null || true
          fi

      - name: Finalize checks and evidence
        id: finalize
        if: always()
        shell: bash
        env:
          AWS_STEP: ${{ steps.aws.outcome }}
          ACCOUNT_STEP: ${{ steps.account.outcome }}
          DNS_STEP: ${{ steps.dns.outcome }}
          ALB_STEP: ${{ steps.alb.outcome }}
          ECS_STEP: ${{ steps.ecs.outcome }}
          RDS_STEP: ${{ steps.rds.outcome }}
          DMS_STEP: ${{ steps.dms.outcome }}
          DATA_STEP: ${{ steps.data.outcome }}
          TOOLS_STEP: ${{ steps.tools.outcome }}
          METADATA_STEP: ${{ steps.database-metadata.outcome }}
          TUNNEL_STEP: ${{ steps.database-tunnel.outcome }}
        run: |
          set -euo pipefail
          file="$PREFLIGHT_RESULT_DIR/checks.tsv"
          touch "$file"
          for item in "AWS:$AWS_STEP" "Account:$ACCOUNT_STEP" "DNS:$DNS_STEP" "ALB:$ALB_STEP" "ECS:$ECS_STEP" "RDS:$RDS_STEP" "DMS:$DMS_STEP" "Database tools:$TOOLS_STEP" "Database metadata:$METADATA_STEP" "Database tunnel:$TUNNEL_STEP" "Data reconciliation:$DATA_STEP"; do
            name="${item%%:*}"
            outcome="${item#*:}"
            if [[ "$outcome" != success ]]; then
              printf '%s\tFAIL\tworkflow outcome=%s\n' "$name" "$outcome" >> "$file"
            fi
          done
          result=PASS
          if grep -q $'\tFAIL\t' "$file" || [[ ! -s "$file" ]]; then result=FAIL; fi
          # Mandatory checks are never waived; missing steps are FAIL.
          for key in 'DNS' 'ALB' 'ECS' 'RDS' 'DMS' 'Data reconciliation'; do
            if ! grep -q "^${key}\s" "$file"; then
              printf '%s\tFAIL\tmissing check result\n' "$key" >> "$file"
              result=FAIL
            fi
          done
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "completed_at=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST')" >> "$GITHUB_OUTPUT"
          if [[ -f "$PREFLIGHT_RESULT_DIR/dms-task-arn.txt" ]]; then
            echo "dms_task_arn=$(cat "$PREFLIGHT_RESULT_DIR/dms-task-arn.txt")" >> "$GITHUB_OUTPUT"
          else
            echo 'dms_task_arn=' >> "$GITHUB_OUTPUT"
          fi
          {
            echo '## Prod migration preflight (read-only)'
            echo "Result: **$result**"
            echo '```'
            cat "$file"
            echo '```'
            echo 'This validates the target databases against DMS table statistics and the expected PostgreSQL catalog baseline.'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$result" = PASS

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-migration-preflight-${{ github.run_id }}
          path: ${{ env.PREFLIGHT_RESULT_DIR }}
          if-no-files-found: warn
          retention-days: 14
