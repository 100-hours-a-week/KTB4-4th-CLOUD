name: Staging Runtime Control

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Staging 실행 상태"
        required: true
        type: choice
        options:
          - start
          - stop
          - start-ecs
          - stop-ecs
      service:
        description: "ECS 개별 제어 대상(start-ecs/stop-ecs에서만 사용)"
        required: true
        default: all
        type: choice
        options:
          - all
          - frontend
          - backend
          - ai

permissions:
  contents: read
  id-token: write

# Terraform Staging Apply와 동시에 실행되지 않게 같은 잠금 이름을 사용한다.
concurrency:
  group: terraform-apply-staging
  cancel-in-progress: false

jobs:
  control:
    name: Staging ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging

    env:
      AWS_REGION: ap-northeast-2
      CLUSTER_NAME: needu-staging-cluster
      ECS_DESIRED_COUNT: "2"
      AUTOSCALING_MIN: "2"
      AUTOSCALING_MAX: "4"
      CONTROL_ACTION: ${{ inputs.action }}
      SELECTED_SERVICE: ${{ inputs.service }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::919551759796:role/NeedU-V2-Staging-Control
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: staging-control-${{ github.run_id }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Stop Staging
        if: inputs.action == 'stop'
        shell: bash
        run: |
          set -euo pipefail

          services=(frontend backend ai)
          databases=(needu-staging-mysql needu-staging-postgres)

          wait_for_db_stopped() {
            local database="$1"
            local timeout_seconds=3600
            local poll_interval_seconds=30
            local started_at=$SECONDS

            while true; do
              status="$(aws rds describe-db-instances \
                --db-instance-identifier "$database" \
                --query 'DBInstances[0].DBInstanceStatus' \
                --output text)"

              if [[ "$status" == "stopped" ]]; then
                echo "$database is stopped."
                return 0
              fi

              if (( SECONDS - started_at >= timeout_seconds )); then
                echo "::error::Timed out waiting for $database to stop. Current status: $status"
                return 1
              fi

              # stop-db-instance 직후 상태 전파가 늦으면 잠시 available로 보일 수 있다.
              if [[ "$status" != "available" && "$status" != "stopping" ]]; then
                echo "::error::$database entered unexpected status while stopping: $status"
                return 1
              fi

              echo "Waiting for $database to stop. Current status: $status"
              sleep "$poll_interval_seconds"
            done
          }

          # Auto Scaling이 서비스를 다시 실행하지 않도록 최소 용량을 먼저 0으로 내린다.
          for service in "${services[@]}"; do
            resource_id="service/${CLUSTER_NAME}/needu-staging-${service}"

            aws application-autoscaling register-scalable-target \
              --service-namespace ecs \
              --resource-id "$resource_id" \
              --scalable-dimension ecs:service:DesiredCount \
              --min-capacity 0 \
              --max-capacity "$AUTOSCALING_MAX"

            aws ecs update-service \
              --cluster "$CLUSTER_NAME" \
              --service "needu-staging-${service}" \
              --desired-count 0 \
              --no-cli-pager >/dev/null
          done

          aws ecs wait services-stable \
            --cluster "$CLUSTER_NAME" \
            --services needu-staging-frontend needu-staging-backend needu-staging-ai

          # 이미 정지 중이거나 정지된 DB에는 중복 요청을 보내지 않는다.
          for database in "${databases[@]}"; do
            status="$(aws rds describe-db-instances \
              --db-instance-identifier "$database" \
              --query 'DBInstances[0].DBInstanceStatus' \
              --output text)"

            if [[ "$status" == "available" ]]; then
              aws rds stop-db-instance \
                --db-instance-identifier "$database" \
                --no-cli-pager >/dev/null
            elif [[ "$status" == "stopping" || "$status" == "stopped" ]]; then
              echo "$database is already $status."
            else
              echo "::error::$database cannot be stopped while status is $status."
              exit 1
            fi
          done

          for database in "${databases[@]}"; do
            wait_for_db_stopped "$database"
          done

      - name: Control selected ECS services
        if: inputs.action == 'start-ecs' || inputs.action == 'stop-ecs'
        shell: bash
        run: |
          set -euo pipefail

          case "$SELECTED_SERVICE" in
            all)
              services=(frontend backend ai)
              ;;
            frontend|backend|ai)
              services=("$SELECTED_SERVICE")
              ;;
            *)
              echo "::error::지원하지 않는 ECS 서비스입니다: $SELECTED_SERVICE"
              exit 1
              ;;
          esac

          ecs_service_names=()

          for service in "${services[@]}"; do
            resource_id="service/${CLUSTER_NAME}/needu-staging-${service}"
            ecs_service_name="needu-staging-${service}"
            ecs_service_names+=("$ecs_service_name")

            if [[ "$CONTROL_ACTION" == "start-ecs" ]]; then
              min_capacity="$AUTOSCALING_MIN"
              desired_count="$ECS_DESIRED_COUNT"
            else
              min_capacity="0"
              desired_count="0"
            fi

            # Auto Scaling이 선택한 실행 수를 되돌리지 않도록 최소 용량을 먼저 변경한다.
            aws application-autoscaling register-scalable-target \
              --service-namespace ecs \
              --resource-id "$resource_id" \
              --scalable-dimension ecs:service:DesiredCount \
              --min-capacity "$min_capacity" \
              --max-capacity "$AUTOSCALING_MAX"

            aws ecs update-service \
              --cluster "$CLUSTER_NAME" \
              --service "$ecs_service_name" \
              --desired-count "$desired_count" \
              --no-cli-pager >/dev/null
          done

          aws ecs wait services-stable \
            --cluster "$CLUSTER_NAME" \
            --services "${ecs_service_names[@]}"

      - name: Start Staging
        if: inputs.action == 'start'
        shell: bash
        run: |
          set -euo pipefail

          services=(frontend backend ai)
          databases=(needu-staging-mysql needu-staging-postgres)

          wait_for_db_stopped() {
            local database="$1"
            local timeout_seconds=3600
            local poll_interval_seconds=30
            local started_at=$SECONDS

            while true; do
              status="$(aws rds describe-db-instances \
                --db-instance-identifier "$database" \
                --query 'DBInstances[0].DBInstanceStatus' \
                --output text)"

              if [[ "$status" == "stopped" ]]; then
                echo "$database is stopped."
                return 0
              fi

              if (( SECONDS - started_at >= timeout_seconds )); then
                echo "::error::Timed out waiting for $database to stop. Current status: $status"
                return 1
              fi

              # stop-db-instance 직후 상태 전파가 늦으면 잠시 available로 보일 수 있다.
              if [[ "$status" != "available" && "$status" != "stopping" ]]; then
                echo "::error::$database entered unexpected status while stopping: $status"
                return 1
              fi

              echo "Waiting for $database to stop. Current status: $status"
              sleep "$poll_interval_seconds"
            done
          }

          # DB가 준비된 후 애플리케이션을 실행해 시작 중 연결 실패를 방지한다.
          for database in "${databases[@]}"; do
            status="$(aws rds describe-db-instances \
              --db-instance-identifier "$database" \
              --query 'DBInstances[0].DBInstanceStatus' \
              --output text)"

            if [[ "$status" == "stopped" ]]; then
              aws rds start-db-instance \
                --db-instance-identifier "$database" \
                --no-cli-pager >/dev/null
            elif [[ "$status" == "available" || "$status" == "starting" ]]; then
              echo "$database is already $status."
            elif [[ "$status" == "stopping" ]]; then
              wait_for_db_stopped "$database"
              aws rds start-db-instance \
                --db-instance-identifier "$database" \
                --no-cli-pager >/dev/null
            else
              echo "::error::$database cannot be started while status is $status."
              exit 1
            fi
          done

          for database in "${databases[@]}"; do
            aws rds wait db-instance-available --db-instance-identifier "$database"
          done

          for service in "${services[@]}"; do
            resource_id="service/${CLUSTER_NAME}/needu-staging-${service}"

            aws application-autoscaling register-scalable-target \
              --service-namespace ecs \
              --resource-id "$resource_id" \
              --scalable-dimension ecs:service:DesiredCount \
              --min-capacity "$AUTOSCALING_MIN" \
              --max-capacity "$AUTOSCALING_MAX"

            aws ecs update-service \
              --cluster "$CLUSTER_NAME" \
              --service "needu-staging-${service}" \
              --desired-count "$ECS_DESIRED_COUNT" \
              --no-cli-pager >/dev/null
          done

          aws ecs wait services-stable \
            --cluster "$CLUSTER_NAME" \
            --services needu-staging-frontend needu-staging-backend needu-staging-ai

      - name: Write summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Staging ${{ inputs.action }} 결과"
            echo
            echo "- 실행자: @${{ github.actor }}"
            echo "- 실행 모드: \`${{ inputs.action }}\`"
            if [[ "$CONTROL_ACTION" == "start-ecs" || "$CONTROL_ACTION" == "stop-ecs" ]]; then
              echo "- ECS 대상: \`$SELECTED_SERVICE\`"
              echo "- RDS 대상: 변경 없음"
            else
              echo "- ECS 대상: frontend, backend, ai"
              echo "- RDS 대상: MySQL, PostgreSQL"
            fi
            echo "- ElastiCache와 ALB는 계속 실행됩니다."
          } >> "$GITHUB_STEP_SUMMARY"
