name: Terraform GCP Validate

on:
  pull_request:
    branches: [main]
    paths:
      - "gcp/**"
      - ".github/workflows/terraform-gcp-*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate - GCP Dev
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        directory:
          - gcp/bootstrap
          - gcp/environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive gcp/

      - name: Initialize without backend
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false -lockfile=readonly -input=false -no-color

      - name: Validate
        working-directory: ${{ matrix.directory }}
        run: terraform validate -no-color

      - name: Verify lock files unchanged
        run: git diff --exit-code -- gcp/**/.terraform.lock.hcl
