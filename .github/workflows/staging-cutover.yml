name: Staging Cutover

on:
  workflow_dispatch:
    inputs:
      target:
        description: "staging.needu.gift 연결 대상"
        required: true
        type: choice
        options:
          - v1
          - v2

permissions:
  contents: read
  id-token: write

# Staging Runtime Control 및 Terraform Apply와 동시에 실행되지 않게 한다.
concurrency:
  group: terraform-apply-staging
  cancel-in-progress: false

jobs:
  cutover:
    name: Switch staging.needu.gift to ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging

    env:
      AWS_REGION: ap-northeast-2
      HOSTED_ZONE_ID: Z10258582M6TRCEOCUBUW
      RECORD_NAME: staging.needu.gift

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::919551759796:role/NeedU-V2-Staging-Control
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: staging-cutover-${{ github.run_id }}

      - name: Switch Staging target
        id: switch
        shell: bash
        run: |
          set -euo pipefail

          case "${{ inputs.target }}" in
            v1) target_domain="v1.needu.gift" ;;
            v2) target_domain="v2.needu.gift" ;;
            *)
              echo "::error::지원하지 않는 전환 대상입니다: ${{ inputs.target }}"
              exit 1
              ;;
          esac

          change_id="$(aws route53 change-resource-record-sets \
            --hosted-zone-id "$HOSTED_ZONE_ID" \
            --change-batch "{
              \"Comment\": \"Staging cutover to ${{ inputs.target }} by GitHub Actions\",
              \"Changes\": [{
                \"Action\": \"UPSERT\",
                \"ResourceRecordSet\": {
                  \"Name\": \"$RECORD_NAME\",
                  \"Type\": \"CNAME\",
                  \"TTL\": 60,
                  \"ResourceRecords\": [{\"Value\": \"$target_domain\"}]
                }
              }]
            }" \
            --query 'ChangeInfo.Id' \
            --output text)"

          aws route53 wait resource-record-sets-changed --id "$change_id"

          current_target="$(aws route53 list-resource-record-sets \
            --hosted-zone-id "$HOSTED_ZONE_ID" \
            --query "ResourceRecordSets[?Name == '${RECORD_NAME}.'] | [0].ResourceRecords[0].Value" \
            --output text)"

          if [[ "$current_target" != "$target_domain" ]]; then
            echo "::error::DNS 전환 결과가 예상과 다릅니다: $current_target"
            exit 1
          fi

          echo "target_domain=$target_domain" >> "$GITHUB_OUTPUT"
          echo "change_id=$change_id" >> "$GITHUB_OUTPUT"

      - name: Write summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Staging Cutover 결과"
            echo
            echo "- 실행자: @${{ github.actor }}"
            echo "- 공통 도메인: \`staging.needu.gift\`"
            echo "- 선택한 환경: \`${{ inputs.target }}\`"
            echo "- 연결 대상: \`${{ steps.switch.outputs.target_domain || '전환 실패' }}\`"
            echo "- Route 53 변경 ID: \`${{ steps.switch.outputs.change_id || '없음' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
