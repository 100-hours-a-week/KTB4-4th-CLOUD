name: Prod Migration Cutover

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type CUTOVER needu.gift TO V2"
        required: true
        type: string
      onboarding_confirm:
        description: "Type RESET PROD USERS AND V2 DATA (test accounts excluded from onboarding reset)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: prod-migration-control
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ inputs.confirm == 'CUTOVER needu.gift TO V2' && inputs.onboarding_confirm == 'RESET PROD USERS AND V2 DATA' }}
    uses: ./.github/workflows/prod-migration-preflight.yml
    permissions:
      contents: read
      id-token: write

  cutover:
    needs: preflight
    if: ${{ inputs.confirm == 'CUTOVER needu.gift TO V2' && inputs.onboarding_confirm == 'RESET PROD USERS AND V2 DATA' && needs.preflight.outputs.result == 'PASS' }}
    runs-on: ubuntu-latest
    environment: prod-migration-cutover
    timeout-minutes: 30
    env:
      AWS_REGION: ap-northeast-2
      EXPECTED_ACCOUNT_ID: "919551759796"
      HOSTED_ZONE_ID: Z10258582M6TRCEOCUBUW
      LIVE_HOST: needu.gift
      PROD_HOST: prod.needu.gift
      V1_EIP: 13.124.155.10
      PROD_ALB_NAME: needu-prod-alb
      PROD_ALB_DNS: needu-prod-alb-314721872.ap-northeast-2.elb.amazonaws.com
      V1_INSTANCE_ID: i-071de18816cfae436
      ECS_CLUSTER: needu-prod-cluster
      FE_SERVICE: needu-prod-frontend
      BE_SERVICE: needu-prod-backend
      EXPECTED_TASK_COUNT: "2"
      DMS_TASK_ARN: ${{ vars.MIGRATION_PROD_DMS_TASK_ARN }}
      DMS_INSTANCE_ID: ${{ vars.MIGRATION_PROD_DMS_INSTANCE_ID }}
      EXPECTED_DMS_TABLES: ${{ vars.MIGRATION_PROD_DMS_TABLES }}
      MYSQL_DB_IDENTIFIER: needu-prod-mysql
      MYSQL_DATABASE: needu
      POSTGRES_DB_IDENTIFIER: needu-prod-postgres
      SSM_BASTION_INSTANCE_ID: i-0fc4a029b4d5b90ca
      MYSQL_LOCAL_PORT: "23306"
      POSTGRES_LOCAL_PORT: "25432"

    steps:
      - uses: actions/checkout@v4
      - name: Configure production cutover AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.MIGRATION_CUTOVER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: prod-migration-cutover-${{ github.run_id }}
      - name: Prepare evidence directory
        shell: bash
        run: |
          echo "EVIDENCE_DIR=$RUNNER_TEMP/prod-cutover-evidence" >> "$GITHUB_ENV"
          echo "PREFLIGHT_RESULT_DIR=$RUNNER_TEMP/prod-cutover-evidence" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/prod-cutover-evidence"
      - name: Verify Preflight PASS
        shell: bash
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.outputs.result }}
          PREFLIGHT_DMS_TASK_ARN: ${{ needs.preflight.outputs.dms_task_arn }}
        run: |
          set -euo pipefail
          test "$PREFLIGHT_RESULT" = PASS
          test "$PREFLIGHT_DMS_TASK_ARN" = "$DMS_TASK_ARN"
      - name: Install database tunnel tools
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "$RUNNER_TEMP/session-manager-plugin.deb"
          sudo dpkg -i "$RUNNER_TEMP/session-manager-plugin.deb"
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-mysql-client postgresql-client netcat-openbsd python3-venv
          python3 -m venv "$RUNNER_TEMP/prod-cutover-venv"
          "$RUNNER_TEMP/prod-cutover-venv/bin/python" -m pip install 'PyMySQL==1.1.1'
          echo "$RUNNER_TEMP/prod-cutover-venv/bin" >> "$GITHUB_PATH"
      - name: Resolve target database connection metadata
        shell: bash
        run: |
          set -euo pipefail
          mysql_json="$(aws rds describe-db-instances --db-instance-identifier "$MYSQL_DB_IDENTIFIER" --query 'DBInstances[0]')"
          postgres_json="$(aws rds describe-db-instances --db-instance-identifier "$POSTGRES_DB_IDENTIFIER" --query 'DBInstances[0]')"
          mysql_secret="$(aws secretsmanager get-secret-value --secret-id "$(jq -r '.MasterUserSecret.SecretArn' <<<"$mysql_json")" --query SecretString --output text)"
          postgres_secret="$(aws secretsmanager get-secret-value --secret-id "$(jq -r '.MasterUserSecret.SecretArn' <<<"$postgres_json")" --query SecretString --output text)"
          mysql_password="$(jq -r '.password' <<<"$mysql_secret")"
          postgres_password="$(jq -r '.password' <<<"$postgres_secret")"
          echo "::add-mask::$mysql_password"
          echo "::add-mask::$postgres_password"
          {
            echo "MYSQL_HOST=$(jq -r '.Endpoint.Address' <<<"$mysql_json")"
            echo "MYSQL_USERNAME=$(jq -r '.username' <<<"$mysql_secret")"
            echo "MYSQL_PASSWORD=$mysql_password"
            echo "POSTGRES_HOST=$(jq -r '.Endpoint.Address' <<<"$postgres_json")"
            echo "POSTGRES_USERNAME=$(jq -r '.username' <<<"$postgres_secret")"
            echo "POSTGRES_PASSWORD=$postgres_password"
          } >> "$GITHUB_ENV"
      - name: Open target database tunnels
        shell: bash
        run: bash scripts/migration/preflight/start-db-tunnel.sh
      - name: Verify production data transform prerequisites before Gate
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/migration/cutover/transform-prod-onboarding.sh
          bash -n scripts/migration/cutover/restore-prod-onboarding.sh
      - name: Verify readiness before any mutation
        shell: bash
        run: bash scripts/migration/cutover/check-prod-readiness.sh
      - name: Enable and verify Write Gate
        shell: bash
        run: |
          echo 'GATE_CHANGE_STARTED=1' >> "$GITHUB_ENV"
          GATE_ACTION=enable bash scripts/migration/cutover/manage-write-gate-prod.sh
          bash scripts/migration/cutover/verify-write-gate-prod.sh
          echo "GATE_ON_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Verify zero open transactions twice
        shell: bash
        run: bash scripts/migration/cutover/check-transactions-prod.sh
      - name: Verify final DMS CDC and validation
        shell: bash
        run: bash scripts/migration/cutover/check-dms-prod-final.sh
      - name: Stop DMS and confirm stopped
        shell: bash
        env:
          DMS_STOP_APPROVED: YES
          GATE_VERIFIED: YES
          TRANSACTIONS_VERIFIED: YES
          CDC_VERIFIED: YES
        run: bash scripts/migration/cutover/stop-dms-prod.sh
      - name: Reconcile target databases after DMS stop
        shell: bash
        run: |
          bash scripts/migration/preflight/check-data-prod.sh
          ! grep -q $'\tFAIL\t' "$PREFLIGHT_RESULT_DIR/checks.tsv"
      - name: Transform users and clean V2 migration data
        shell: bash
        env:
          EXPECTED_MYSQL_HOST: needu-prod-mysql.chmgo2a26a97.ap-northeast-2.rds.amazonaws.com
          PROD_ONBOARDING_TRANSFORM_APPROVED: ${{ inputs.onboarding_confirm == 'RESET PROD USERS AND V2 DATA' && 'YES' || 'NO' }}
        run: |
          set -euo pipefail
          export ONBOARDING_ROLLBACK_FILE="$RUNNER_TEMP/prod-onboarding-rollback.json"
          bash scripts/migration/cutover/transform-prod-onboarding.sh \
            | tee "$EVIDENCE_DIR/prod-data-transform.txt"
      - name: Switch API and frontend to V2
        shell: bash
        run: CUTOVER_TARGET=v2 bash scripts/migration/cutover/switch-alb-prod.sh
      - name: Verify V2 target health before releasing gate
        shell: bash
        run: |
          set -euo pipefail
          for target_group_name in needu-prod-fe needu-prod-be; do
            target_group_arn="$(aws elbv2 describe-target-groups \
              --names "$target_group_name" \
              --query 'TargetGroups[0].TargetGroupArn' \
              --output text)"
            target_health="$(aws elbv2 describe-target-health \
              --target-group-arn "$target_group_arn" \
              --output json)"
            printf '%s\n' "$target_health" \
              > "$EVIDENCE_DIR/${target_group_name}-after-switch.json"
            healthy_count="$(jq '[.TargetHealthDescriptions[] | select(.TargetHealth.State == "healthy")] | length' \
              <<< "$target_health")"
            if (( healthy_count < EXPECTED_TASK_COUNT )); then
              echo "::error::$target_group_name has $healthy_count healthy targets; expected at least $EXPECTED_TASK_COUNT"
              exit 1
            fi
            echo "[PASS] $target_group_name healthy targets=$healthy_count"
          done
      - name: Disable Write Gate
        shell: bash
        run: |
          GATE_ACTION=disable bash scripts/migration/cutover/manage-write-gate-prod.sh
          echo 'GATE_OFF_CONFIRMED=1' >> "$GITHUB_ENV"
          echo "GATE_OFF_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Recover V1 before Write Gate release
        if: ${{ failure() && env.GATE_CHANGE_STARTED == '1' && env.GATE_OFF_CONFIRMED != '1' }}
        shell: bash
        env:
          EXPECTED_MYSQL_HOST: needu-prod-mysql.chmgo2a26a97.ap-northeast-2.rds.amazonaws.com
        run: |
          set -euo pipefail
          export ONBOARDING_ROLLBACK_FILE="$RUNNER_TEMP/prod-onboarding-rollback.json"
          if [[ -s "$ONBOARDING_ROLLBACK_FILE" ]]; then
            bash scripts/migration/cutover/restore-prod-onboarding.sh
          fi
          bash scripts/migration/cutover/recover-prod-before-release.sh
      - name: Close database tunnels
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/preflight-tunnel-pids" ]]; then
            xargs kill < "$RUNNER_TEMP/preflight-tunnel-pids" 2>/dev/null || true
          fi
      - name: Cutover summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Prod Migration Cutover'
            echo "- Result: ${{ job.status }}"
            echo "- Gate ON: ${GATE_ON_AT:-not confirmed}"
            echo "- Gate OFF: ${GATE_OFF_AT:-not confirmed}"
            echo '- Non-test MySQL users are reset to ONBOARDING; test users (external_id < 0) keep their onboarding state.'
            echo '- V2 taste profiles, recommendation rows, and AI message contents are deleted; in-progress AI rooms are expired; product categories are normalized.'
            echo '- A failure before Gate release restores saved user onboarding state and routes traffic back to V1. V2 cleanup is not restored; reload/reset V2 data before retry.'
            echo '- Failure before Gate release automatically restores ALB V1 and removes the Gate.'
            echo '- DMS is never restarted automatically after it has been stopped.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-cutover-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 30
